<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diffchecker - Simple Text Comparison Tool</title>
  <meta name="description"
    content="A lightweight, fast, and free client-side text comparison tool. Highlight additions and removals in split view with word-level and character-level visual diffs.">
  <meta name="theme-color" content="#0d9488">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">

  <!-- Google Fonts: Imran Pollob Brand Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400..700;1,400..700&family=Playfair+Display:ital,wght@0,500..800;1,500..800&family=Plus+Jakarta+Sans:ital,wght@0,400..800;1,400..800&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="css/styles.css">
</head>

<body>

  <!-- Header -->
  <header class="header">
    <div class="header-container">
      <a href="./" class="brand" title="Diffchecker - Reload">
        <img src="favicon.svg" alt="Diffchecker Logo" class="brand-icon">
        <span class="brand-title">Diffchecker</span>
      </a>
      <div class="header-actions">
        <a href="https://github.com/imranpollob/diffchecker" target="_blank" rel="noopener noreferrer" class="btn-icon"
          title="View on GitHub" aria-label="GitHub Repository">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
            <path
              d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z" />
          </svg>
        </a>
        <button id="themeToggleBtn" class="btn-icon" title="Toggle Theme" aria-label="Toggle Light/Dark Theme">
          <svg id="themeIconSun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
          <svg id="themeIconMoon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="main-content">

    <!-- Input Section -->
    <section class="input-section">
      <div class="editors-grid">

        <!-- Original Text Area -->
        <div class="editor-pane">
          <div class="pane-header">
            <span class="pane-title pane-title-original">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <line x1="5" y1="12" x2="19" y2="12"></line>
              </svg>
              Original Text
            </span>
            <span class="pane-stats" id="originalStats">0 lines, 0 chars</span>
            <div class="pane-actions">
              <button id="copyOriginalBtn" class="btn-ghost-sm" title="Copy original text">Copy</button>
              <button id="pasteOriginalBtn" class="btn-ghost-sm" title="Paste from clipboard">Paste</button>
              <button id="clearOriginalBtn" class="btn-ghost-sm" title="Clear text">Clear</button>
            </div>
          </div>
          <div class="textarea-container">
            <textarea id="originalInput" class="diff-textarea" placeholder="Paste or type original text here..."
              spellcheck="false"></textarea>
          </div>
        </div>

        <!-- Center Swap Button -->
        <div class="swap-button-container">
          <button id="swapTextsBtn" class="btn-swap" title="Swap Original and Changed texts" aria-label="Swap Texts">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <polyline points="17 1 21 5 17 9"></polyline>
              <path d="M3 11V9a4 4 0 0 1 4-4h14"></path>
              <polyline points="7 23 3 19 7 15"></polyline>
              <path d="M21 13v2a4 4 0 0 1-4 4H3"></path>
            </svg>
          </button>
        </div>

        <!-- Changed Text Area -->
        <div class="editor-pane">
          <div class="pane-header">
            <span class="pane-title pane-title-changed">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
              </svg>
              Changed Text
            </span>
            <span class="pane-stats" id="changedStats">0 lines, 0 chars</span>
            <div class="pane-actions">
              <button id="copyChangedBtn" class="btn-ghost-sm" title="Copy changed text">Copy</button>
              <button id="pasteChangedBtn" class="btn-ghost-sm" title="Paste from clipboard">Paste</button>
              <button id="clearChangedBtn" class="btn-ghost-sm" title="Clear text">Clear</button>
            </div>
          </div>
          <div class="textarea-container">
            <textarea id="changedInput" class="diff-textarea" placeholder="Paste or type modified text here..."
              spellcheck="false"></textarea>
          </div>
        </div>

      </div>
    </section>

    <!-- Control & Options Toolbar -->
    <section class="control-bar">
      <div class="control-group-left">
        <button id="compareBtn" class="btn-primary" title="Compare texts (Ctrl+Enter)">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <polyline points="16 3 21 3 21 8"></polyline>
            <line x1="4" y1="20" x2="21" y2="3"></line>
            <polyline points="21 16 21 21 16 21"></polyline>
            <line x1="15" y1="15" x2="21" y2="21"></line>
            <line x1="4" y1="4" x2="9" y2="9"></line>
          </svg>
          Find Difference
        </button>

        <div class="view-tabs" role="tablist">
          <button class="tab-btn active" data-mode="word" role="tab" aria-selected="true"
            title="Word-level difference in split view">Word Diff</button>
          <button class="tab-btn" data-mode="char" role="tab" aria-selected="false"
            title="Character-level difference in split view">Char Diff</button>
        </div>
      </div>

      <div class="control-group-right">
        <label class="option-toggle" title="Wrap long lines in diff view">
          <input type="checkbox" id="optWrapLines" checked>
          <span>Wrap Lines</span>
        </label>
        <label class="option-toggle" title="Ignore differences in whitespace">
          <input type="checkbox" id="optIgnoreWhitespace">
          <span>Ignore Whitespace</span>
        </label>
        <label class="option-toggle" title="Ignore additions or deletions of empty/blank lines">
          <input type="checkbox" id="optIgnoreBlankLines">
          <span>Ignore Blank Lines</span>
        </label>
        <label class="option-toggle" title="Ignore character casing differences">
          <input type="checkbox" id="optIgnoreCase">
          <span>Ignore Case</span>
        </label>

        <button id="sampleBtn" class="btn-secondary" title="Load sample comparison">Sample</button>
        <button id="clearAllBtn" class="btn-secondary" title="Clear all text inputs">Clear All</button>
      </div>
    </section>

    <!-- Results Section -->
    <section class="results-section">
      <div class="results-header" id="resultsHeader" style="display: none;">
        <div class="results-header-left">
          <button id="copyOriginalResultBtn" class="btn-secondary" title="Copy Original side text">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
            </svg>
            Copy Original
          </button>
        </div>
        <div class="stats-summary" id="statsSummary"></div>
        <div class="results-header-right">
          <button id="copyChangedResultBtn" class="btn-secondary" title="Copy Changed side text">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
            </svg>
            Copy Changed
          </button>
        </div>
      </div>

      <!-- Diff Container Card -->
      <div class="diff-card" id="diffCard">
        <!-- Initial Placeholder State -->
        <div class="empty-state" id="emptyState">
          <svg class="empty-state-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path
              d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"
              stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          <div class="empty-state-title">No Comparison Yet</div>
          <p class="empty-state-text">Paste your original and changed text above, then click <strong>Find
              Difference</strong> button</p>
        </div>

        <!-- Rendered Diff Output Area -->
        <div id="diffOutput" class="wrap-lines" style="display: none;"></div>
      </div>
    </section>

  </main>

  <!-- Selection Action Tooltip & Replace Popover -->
  <div id="diffSelectionTooltip" class="diff-selection-tooltip" style="display: none;">
    <!-- Action Buttons Bar -->
    <div class="tooltip-actions" id="tooltipActions">
      <button id="tooltipCopyBtn" class="tooltip-btn" title="Copy selected text">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
          <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
        </svg>
        <span>Copy</span>
      </button>
      <div class="tooltip-divider"></div>
      <button id="tooltipReplaceBtn" class="tooltip-btn" title="Replace selected text">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
          <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
        </svg>
        <span>Replace</span>
      </button>
    </div>

    <!-- Replace Popover Form -->
    <div class="tooltip-replace-form" id="tooltipReplaceForm" style="display: none;">
      <div class="replace-form-header">
        <span class="replace-form-title" id="replaceFormTitle">Replace Text</span>
        <button id="closeReplaceFormBtn" class="btn-ghost-icon" title="Close">&times;</button>
      </div>
      <textarea id="replaceInput" class="replace-textarea" placeholder="Enter replacement text..." rows="5"
        spellcheck="false"></textarea>
      <div class="replace-form-actions">
        <button id="cancelReplaceBtn" class="btn-secondary-sm">Cancel</button>
        <button id="confirmReplaceBtn" class="btn-primary-sm">Replace</button>
      </div>
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="toast">Copied to clipboard!</div>

  <!-- Scripts -->
  <script src="js/diff-engine.js"></script>
  <script src="js/app.js"></script>
</body>

</html>
